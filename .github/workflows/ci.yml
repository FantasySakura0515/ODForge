name: CI

on:
  push:
    branches: [main]
    # Without this the `release` job below could never run: it gates on
    # `refs/tags/v*`, but a workflow that only listens to branch pushes is never
    # triggered by a tag at all. The release path was unreachable, and nothing
    # said so — `git tag v1.0.0 && git push --tags` simply did nothing.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The whole point of this file: before it existed, "the tests pass" meant "they
# passed on one developer's machine, with whatever happened to be installed on
# it, against a `web/dist` built at an unknown time from an unknown commit".
# Every job below is deliberately hostile to that: clean checkout, pinned
# toolchain, no pre-existing build products, no credentials.
env:
  # Any provider variable left set would let a test reach a real API and spend
  # money. conftest also scrubs these; belt and braces.
  ODFORGE_BACKEND: ""
  ODFORGE_VISION_BACKEND: "off"
  DEEPSEEK_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject (requires-python). It is in the
        # matrix so the floor is a tested claim rather than a hopeful one.
        python: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (test extra — everything the suite needs to COLLECT)
        working-directory: odforge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      # Deliberately UNPINNED: this lane is the early warning that upstream has
      # moved. It is how mcp 2.0 (which removed a module we import) and PyMuPDF
      # 1.28.2 (which prints to stdout) would have been caught, instead of
      # passing for months on a developer venv pinned to the old ones by
      # accident. The locked lane below is the reproducible counterpart.
      - name: pytest (with coverage threshold)
        working-directory: odforge
        run: python -m pytest -q --cov --cov-report=term

  locked:
    name: python (locked dependency set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same suite, pinned resolution. If this is green and the unpinned lane is
      # red, an upstream release broke us; if this is red, we broke ourselves.
      # Telling those two apart is the entire reason both lanes exist.
      - name: Install against constraints.txt
        working-directory: odforge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,vision,web]" -c constraints.txt
      - name: The pins must actually be the versions in use
        working-directory: odforge
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import re, sys
          bad = []
          for line in open("constraints.txt", encoding="utf-8"):
              line = line.split("#")[0].strip()
              if not line or "==" not in line:
                  continue
              name, pinned = line.split("==", 1)
              try:
                  actual = md.version(name)
              except md.PackageNotFoundError:
                  continue  # platform-specific pin, not installed here
              if actual != pinned:
                  bad.append(f"{name}: pinned {pinned}, installed {actual}")
          if bad:
              sys.exit("FAIL: constraints did not take effect —\n  " + "\n  ".join(bad))
          print("all applicable pins honoured")
          PY
      - run: python -m pytest -q --cov --cov-report=term
        working-directory: odforge

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned linter turns an upstream release into a red build on
      # a commit that changed nothing.
      - run: python -m pip install "ruff==0.15.4"
      - run: ruff check .
        working-directory: odforge

  frontend:
    name: frontend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22", "24"]
    defaults:
      run:
        working-directory: odforge/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: odforge/web/package-lock.json
      # `npm ci` (not install): the lockfile decides, so the build is the same
      # one everywhere.
      - run: npm ci
      - run: npm test
      - name: typecheck (sources)
        run: npm run typecheck
      - name: typecheck (INCLUDING tests)
        run: npm run typecheck:tests
      - name: production build
        run: npm run build

  wheel:
    name: wheel build + clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: odforge/web/package-lock.json
      - name: Refuse to reuse a stale local build
        # A checkout has no web/dist, but say so out loud: reusing one is the bug
        # this job exists to catch.
        run: rm -rf odforge/web/dist odforge/src/odforge/webui
      - run: python -m pip install build
      - name: Build the wheel (the hook runs npm ci + npm run build)
        run: python -m build --wheel --outdir dist
        working-directory: odforge
      - name: The wheel must actually contain the cockpit
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel, = glob.glob("odforge/dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          assets = [n for n in names if n.startswith("odforge/webui/")]
          print(f"{wheel}: {len(assets)} web assets")
          if not any(n == "odforge/webui/index.html" for n in assets):
              sys.exit("FAIL: wheel has no web cockpit — refusing to publish it")
          PY
      - name: Clean-install the wheel into a fresh venv and serve it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install "$(ls odforge/dist/*.whl)[web]"
          /tmp/smoke/bin/python -m pip install httpx
          cd odforge && /tmp/smoke/bin/python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: odforge/dist/*.whl
          if-no-files-found: error

  integration:
    name: LibreOffice integration (odt / odp / ods + preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice fonts-noto-cjk
      - run: python -m pip install -e ".[test]"
        working-directory: odforge
      # These tests skip themselves when soffice is absent — which means on every
      # other job they are silently not running. This lane is where they count,
      # so the run is asserted rather than assumed.
      - name: Run the soffice-gated tests (and prove they were not all skipped)
        run: |
          python -m pytest -q -rs \
            tests/test_validate.py tests/test_preview.py \
            tests/test_render_odp.py tests/test_render_ods.py \
            tests/test_render_odt.py tests/test_mcp.py \
            --junitxml=junit.xml
          python - <<'PY'
          import re, sys
          # Two attributes off pytest's own junit header. Deliberately not an XML
          # parser: nothing here needs one, and the stdlib parsers carry XXE and
          # entity-expansion footguns that are not worth inviting into CI.
          header = re.search(r"<testsuite\b[^>]*>", open("junit.xml", encoding="utf-8").read())
          attrs = dict(re.findall(r'(\w+)="([^"]*)"', header.group(0)))
          ran = int(attrs.get("tests", 0)) - int(attrs.get("skipped", 0))
          print(f"executed {ran} tests in the LibreOffice lane")
          if ran < 50:
              sys.exit("FAIL: the LibreOffice lane skipped nearly everything")
          PY
        working-directory: odforge
      # The lane above covers renderers and gates one file at a time. It does NOT
      # cover the thing a user actually does: drive the web pipeline end to end
      # and download the bytes. That lives in test_integration_pipeline.py, which
      # skips itself without soffice — so before this step it ran nowhere, in a
      # lane whose entire purpose is being the place where it runs.
      - name: Run the real cross-layer pipeline (zero skips allowed)
        run: |
          python -m pytest -q -rs tests/test_integration_pipeline.py \
            --junitxml=junit-integration.xml
          python - <<'PY'
          import re, sys
          header = re.search(
              r"<testsuite\b[^>]*>",
              open("junit-integration.xml", encoding="utf-8").read(),
          )
          attrs = dict(re.findall(r'(\w+)="([^"]*)"', header.group(0)))
          total, skipped = int(attrs.get("tests", 0)), int(attrs.get("skipped", 0))
          print(f"integration pipeline: {total} collected, {skipped} skipped")
          # Any skip here means soffice was not found and the lane silently
          # certified nothing. That is the exact failure this job exists to make
          # impossible, so it is an error rather than a note in the log.
          if total == 0 or skipped:
              sys.exit("FAIL: the cross-layer pipeline did not actually run")
          PY
        working-directory: odforge

  release:
    name: release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    # A tag may only publish an artifact every gate above already accepted.
    needs: [python, locked, lint, frontend, wheel, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Publish the CI-built wheel (never a locally built one)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
