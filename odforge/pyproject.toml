[project]
name = "odforge"
version = "0.1.0"
description = "Forge natural language into native ODF documents (.odt/.odp/.ods)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "odfdo>=3.22", "pydantic>=2.7", "typer>=0.12", "rich>=13",
  "openai>=1.40", "mcp>=1.2", "lxml>=6.1,<7", "json-repair>=0.30",
  "PyMuPDF>=1.24",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2.0", "ruff>=0.15"]
# Vision critic (Task 16.2). Imported lazily inside critic.py's claude backend,
# so it is never required to import the package or run the off/ollama paths.
vision = ["anthropic>=0.40"]
# Web API (Task 18.1). Imported only by webapi.py / the `serve` command, never at
# package import — the core suite runs without these installed.
web = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.0", "python-dotenv>=1.0"]
[project.scripts]
odforge = "odforge.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/odforge"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
