[project]
name = "odforge"
version = "0.1.0"
description = "Forge natural language into native ODF documents (.odt/.odp/.ods)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "odfdo>=3.22", "pydantic>=2.7", "typer>=0.12", "rich>=13",
  "openai>=1.40", "mcp>=1.2", "lxml>=5", "json-repair>=0.30",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
odforge = "odforge.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/odforge"]
[tool.pytest.ini_options]
testpaths = ["tests"]
