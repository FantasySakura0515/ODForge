[project]
name = "odforge"
version = "0.1.0"
description = "Forge natural language into native ODF documents (.odt/.odp/.ods)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "odfdo>=3.22", "pydantic>=2.7", "typer>=0.12", "rich>=13",
  "openai>=1.40", "mcp>=1.2", "lxml>=6.1,<7", "json-repair>=0.30",
  "PyMuPDF>=1.24",
]
[project.optional-dependencies]
# Everything needed to COLLECT and RUN the full test suite on a clean machine.
# ``dev`` used to be the only extra and it did not include the web/vision deps,
# so a fresh checkout could not collect tests/test_webapi.py at all — the suite
# only passed on machines that already had them from some earlier experiment.
test = [
  "pytest>=8", "pytest-cov>=5", "httpx>=0.27",
  "fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.0", "python-dotenv>=1.0",
  "anthropic>=0.40",
]
dev = ["odforge[test]", "ruff>=0.15", "build>=1.2"]
# Vision critic (Task 16.2). Imported lazily inside critic.py's claude backend,
# so it is never required to import the package or run the off/ollama paths.
vision = ["anthropic>=0.40"]
# Web API (Task 18.1). Imported only by webapi.py / the `serve` command, never at
# package import — the core suite runs without these installed.
web = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.0", "python-dotenv>=1.0"]
[project.scripts]
odforge = "odforge.cli:app"
# The MCP server as a runnable command, so an MCP host can be pointed at
# ODForge without knowing module paths or which interpreter to use.
odforge-mcp = "odforge.mcp_server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/odforge"]
# Staged by the build hook below; listed here so it ships even though it is a
# gitignored build product.
artifacts = ["src/odforge/webui/**"]
# The web cockpit is built from source (npm ci + npm run build against the
# committed lockfile) and staged into the package as odforge/webui. See
# hatch_build.py — a wheel that would ship without it fails the build instead.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
[tool.hatch.build.targets.sdist]
# The frontend *sources* must travel in the sdist, or `pip install` from it
# cannot rebuild the cockpit.
include = [
  "src/odforge",
  "tests",
  "web/src",
  "web/index.html",
  "web/package.json",
  "web/package-lock.json",
  "web/tsconfig.json",
  "web/tsconfig.test.json",
  "web/vite.config.ts",
  "hatch_build.py",
  "constraints.txt",
  "README.md",
  "LICENSE",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/odforge"]
branch = true
omit = ["src/odforge/benchmark.py"]

[tool.coverage.report]
# Baseline, measured on the suite as it stands (86.4% at the time of writing).
# Raise it, never lower it: a drop means new code arrived without tests, which is
# exactly what the number is for.
fail_under = 85
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Explicit, and every rule here passes today. The previous config selected
# nothing, so `ruff check .` was a no-op that looked like a passing lint gate.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff-specific
]
ignore = [
  # Ambiguous-unicode checks fire on every line of this project's zh-TW prose
  # (full-width comma/colon are the correct characters here, not lookalikes).
  "RUF001", "RUF002", "RUF003",
  # `Optional[X]` / `Dict[...]` are used deliberately and consistently; churning
  # them to PEP-604 syntax across the codebase is noise, not a fix.
  "UP006", "UP007", "UP035", "UP045",
  "B008",   # typer/FastAPI dependency defaults are function calls by design
  "SIM105", # `contextlib.suppress` is not always clearer than try/except/pass
  # typer resolves CLI choices from `class X(str, Enum)`; `enum.StrEnum` is not
  # an accepted substitute in the pinned typer, so this rule cannot be honoured
  # without breaking `--theme`/`--backend`/`--mode`.
  "UP042",
  # A whitespace-delimited block is how the OpenFormula function allowlist stays
  # readable and diffable; a 57-element list literal is not an improvement.
  "SIM905",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately build long literal payloads, assert on regex-looking
# strings, and nest `with` blocks for readability.
"tests/**" = ["E501", "B011", "SIM117", "UP031", "RUF043", "B007", "RUF059", "C416", "B905"]
# The zh-TW prompt constants are long strings by nature.
"src/odforge/llm.py" = ["E501"]
"src/odforge/critic.py" = ["E501"]
